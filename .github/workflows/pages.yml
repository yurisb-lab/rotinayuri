# Publica a pasta do repositório no GitHub Pages a cada push no branch padrão.
# O app é estático: não há build, é só copiar os arquivos como estão.
#
# O gatilho não fixa um nome de branch de propósito. Este repositório ainda não
# tem `main`, e um nome escrito à mão aqui quebraria em silêncio no dia em que
# o padrão mudasse — o fluxo rodaria e não publicaria nada, ou não rodaria.
# Comparar com `default_branch` acerta nos dois casos.

name: Publicar no GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
